name: データのチェック
on:
  push:
    paths: ['data/**', 'assets/img/**', 'scripts/check-data.mjs']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-data.mjs
